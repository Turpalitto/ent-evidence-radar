name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Аудит I-10: уязвимости рантайм-зависимостей блокируют сборку (dev-зависимости — только предупреждение).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high || echo "::warning::npm audit нашёл проблемы в dev-зависимостях"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Аудит F-16: схема drizzle и снапшоты миграций должны быть согласованы.
      - name: Drizzle migrations consistency
        run: npm run db:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Собираем образ (без публикации) и проверяем, что контейнер стартует и /api/health отвечает.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ent-evidence-radar:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name radar -p 3000:3000 -e API_SECRET=ci-secret ent-evidence-radar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json; echo
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::/api/health не ответил за 60 с"; docker logs radar; exit 1
            fi
            sleep 2
          done
          # Процесс должен работать от uid 1001 (F-17).
          uid=$(docker exec radar id -u)
          test "$uid" = "1001" || { echo "::error::ожидался uid 1001, получен $uid"; exit 1; }

      # Сквозная проверка собранного приложения: SSR всех страниц, язык по cookie, Atom/манифест/sitemap,
      # ETag/304, заголовки безопасности, закрытость изменяющих маршрутов без токена.
      - name: Smoke checks (pages, API, headers, auth)
        run: node scripts/smoke.mjs http://127.0.0.1:3000 --secret ci-secret --timeout 30

      # Штатная остановка (R-01): SIGTERM → хуки (прерывание refresh, закрытие PGlite) → exit 0.
      - name: Graceful stop
        run: |
          set -euo pipefail
          docker stop -t 20 radar
          code=$(docker inspect --format '{{.State.ExitCode}}' radar)
          docker logs radar 2>&1 | grep -E '"event":"shutdown[.](started|hook_done|finished)"' || true
          test "$code" = "0" || { echo "::error::контейнер завершился с кодом $code (ожидался 0 после SIGTERM)"; docker logs radar; exit 1; }
          docker logs radar 2>&1 | grep -q '"event":"shutdown.finished"' || { echo "::error::в логах нет shutdown.finished — хуки остановки не отработали"; docker logs radar; exit 1; }
          docker logs radar 2>&1 | grep -q '"event":"shutdown.hook_done","hook":"db"' || { echo "::error::хук закрытия БД не выполнен"; docker logs radar; exit 1; }
          docker rm -f radar
