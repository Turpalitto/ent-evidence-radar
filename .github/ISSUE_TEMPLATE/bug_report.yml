name: Ошибка
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
      description: Фактическое поведение и чем оно отличается от ожидаемого.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Открыть …
        2. Нажать …
        3. Увидеть …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / коммит
      description: Из `GET /api/health` (`version`) или экрана диагностики в настройках (коммит).
  - type: dropdown
    id: db
    attributes:
      label: База данных
      options: [PGlite (встроенная), PostgreSQL]
  - type: textarea
    id: logs
    attributes:
      label: Логи / requestId
      description: JSON-строки из лога сервера или `requestId` из ответа 500 (без секретов!).
      render: text
